version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: liapoldus
    main: ./cmd/liapoldus
    binary: liapoldus
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Liapoldus/cli/internal/presentation/cli.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
